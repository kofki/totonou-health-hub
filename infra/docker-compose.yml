name: health-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthhub}
      POSTGRES_USER: ${POSTGRES_USER:-healthhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthhub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Example: fake-gcs-server emulates Google Cloud Storage locally, so the same
  # google-cloud-storage client code works here and against the real GCS bucket in prod
  gcs:
    image: fsouza/fake-gcs-server:1.52
    restart: unless-stopped
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"
    volumes:
      - gcsdata:/storage

  api:
    build:
      context: ../api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-healthhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-healthhub}
      GCS_ENDPOINT: http://gcs:4443
      GCS_BUCKET: ${GCS_BUCKET:-healthhub-images}
    ports:
      - "8080:8080"

  ml-service:
    build:
      context: ../ml-service
    profiles: ["app"]
    environment:
      GCS_ENDPOINT: http://gcs:4443
      GCS_BUCKET: ${GCS_BUCKET:-healthhub-images}
    ports:
      - "8000:8000"

  ingestion:
    build:
      context: ../ingestion
    profiles: ["app"]
    environment:
      API_BASE_URL: http://api:8080
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      VESYNC_EMAIL: ${VESYNC_EMAIL:-}
      VESYNC_PASSWORD: ${VESYNC_PASSWORD:-}
      VESYNC_TIMEZONE: ${VESYNC_TIMEZONE:-America/New_York}

volumes:
  pgdata:
  gcsdata:
