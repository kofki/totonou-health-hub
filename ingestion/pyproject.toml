[project]
name = "healthhub-ingestion"
version = "0.1.0"
description = "Health Hub Garmin/VeSync sync worker"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.2.19",
    "pyvesync>=2.1",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
