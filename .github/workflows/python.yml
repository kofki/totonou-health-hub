name: python

on:
  push:
    branches: [main]
    paths: ["ml-service/**", "ingestion/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["ml-service/**", "ingestion/**", ".github/workflows/python.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml-service, ingestion]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
